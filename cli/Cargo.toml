[package]
name = "macicon"
version = "0.2.2" # x-release-please-version
edition = "2024"
rust-version = "1.90.0"
description = "Generate, customize, and apply Apple continuous-curvature squircle app icons on macOS"
license = "MIT"
repository = "https://github.com/DarkRader/macicon"
homepage = "https://github.com/DarkRader/macicon"
readme = "README.md"
keywords = ["macos", "icon", "squircle", "icns", "apple"]
categories = ["command-line-utilities", "graphics", "os::macos-apis"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"
tempfile = "=3.27.0"
ureq = "=3.4.1"
url = "=2.5.8"
