[package]
name = "macicon"
version = "0.1.0" # x-release-please-version
edition = "2024"
description = "Generate and apply custom macOS squircle icons"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tempfile = "3.10"
ureq = { version = "2.10", features = ["tls"] }
url = "2.5"
