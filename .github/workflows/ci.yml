name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise and tools
        uses: jdx/mise-action@v2

      - name: Install rustfmt and clippy
        run: mise exec -- rustup component add rustfmt clippy

      - name: Check Formatting (cargo fmt)
        run: mise exec -- cargo fmt --check


      - name: Lint (cargo clippy)
        run: mise exec -- cargo clippy --all-targets -- -D warnings

      - name: Run Tests (cargo test)
        run: mise exec -- cargo test

      - name: Build Release Binary
        run: mise exec -- cargo build --release
